# CI runs exactly what `make check` runs locally — no CI-only logic
# (ADR-0003 in predev-brain). Ruff is pinned inside scripts/lint_changed.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the changed-files diff needs the merge-base with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1

      - run: make check
